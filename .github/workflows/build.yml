name: Build Tunnel Controller APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      cloudflared_ref:
        description: 'cloudflared tag/branch to build (empty = latest release tag)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version_name: ${{ env.VERSION_NAME }}
      version_code: ${{ env.VERSION_CODE }}
      cloudflared_ref: ${{ steps.cf.outputs.ref }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Resolve cloudflared version
        id: cf
        env:
          INPUT_REF: ${{ github.event.inputs.cloudflared_ref }}
        run: |
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs https://github.com/cloudflare/cloudflared.git \
              | awk -F/ '{print $3}' | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          fi
          if [ -z "$REF" ]; then
            echo "❌ Could not resolve a cloudflared version"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "📌 cloudflared $REF"

      - name: Cache cloudflared binaries
        id: cache-cf
        uses: actions/cache@v4
        with:
          path: output
          key: cloudflared-${{ steps.cf.outputs.ref }}-ndk26c-v1

      - name: Clone cloudflared
        if: steps.cache-cf.outputs.cache-hit != 'true'
        env:
          CF_REF: ${{ steps.cf.outputs.ref }}
        run: git clone --depth 1 --branch "$CF_REF" https://github.com/cloudflare/cloudflared.git cloudflared

      - name: Setup Go
        if: steps.cache-cf.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: cloudflared/go.mod
          cache-dependency-path: cloudflared/go.sum

      - name: Cache Android NDK
        if: steps.cache-cf.outputs.cache-hit != 'true'
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r26c
          key: ndk-26c-linux

      - name: Setup Android NDK
        if: steps.cache-cf.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip

      - name: Build cloudflared for Android (all architectures)
        if: steps.cache-cf.outputs.cache-hit != 'true'
        env:
          CF_REF: ${{ steps.cf.outputs.ref }}
        run: |
          SOURCE_DIR=$PWD
          NDK_BIN="$PWD/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$SOURCE_DIR"/output/arm64-v8a "$SOURCE_DIR"/output/armeabi-v7a "$SOURCE_DIR"/output/x86_64 "$SOURCE_DIR"/output/x86
          cd cloudflared

          build_arch() {
            local GOARCH=$1
            local CC_ARCH=$2
            local OUTPUT_DIR=$3
            echo "🔨 Building for $GOARCH ($OUTPUT_DIR)..."
            GOOS=android GOARCH=$GOARCH CGO_ENABLED=1 \
              CC="$NDK_BIN/$CC_ARCH" CXX="$NDK_BIN/${CC_ARCH}++" \
              go build -trimpath -ldflags="-s -w -X main.Version=$CF_REF" -o cloudflared ./cmd/cloudflared
            file cloudflared
            cp cloudflared "$SOURCE_DIR/output/$OUTPUT_DIR/libcloudflared.so"
            chmod +x "$SOURCE_DIR/output/$OUTPUT_DIR/libcloudflared.so"
          }

          build_arch arm64 aarch64-linux-android21-clang   arm64-v8a
          build_arch arm   armv7a-linux-androideabi21-clang armeabi-v7a
          build_arch amd64 x86_64-linux-android21-clang    x86_64
          build_arch 386   i686-linux-android21-clang      x86

          echo "✅ Build completed for all architectures."

      - name: Increment version code
        if: github.event_name != 'pull_request'
        run: |
          if [ -f versioncode.txt ]; then
            VERSION_CODE=$(cat versioncode.txt | tr -d '\r')
          else
            VERSION_CODE=0
          fi
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_NAME=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo $NEW_VERSION_CODE > versioncode.txt
          echo "✅ Version set to: $NEW_VERSION"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      - name: Read current version (PR)
        if: github.event_name == 'pull_request'
        run: |
          VERSION_NAME=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r')
          VERSION_CODE=$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '\r')
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0.0"
          [ -z "$VERSION_CODE" ] && VERSION_CODE="0"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "ℹ️ PR build — dùng version hiện tại ${VERSION_NAME}+${VERSION_CODE}"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "❌ Keystore file is empty!"
            exit 1
          fi
          echo "📏 Keystore size: $(wc -c < android/app/upload-keystore.jks) bytes"
          echo "✅ Keystore restored"

      - name: Create key.properties
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "✅ key.properties created"

      - name: Verify keystore alias
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "❌ Alias '$KEY_ALIAS' not found in keystore!"
            keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PASS" | grep -E "Alias name:" || true
            exit 1
          fi
          echo "✅ Keystore alias verified"

      - name: Create Flutter project and copy sources
        run: |
          SOURCE_DIR=$PWD
          flutter create --org com.TGNF --project-name tunnel_controller /tmp/tunnel_temp
          rsync -a --ignore-existing \
            --exclude='.git' --exclude='/lib' --exclude='/test' \
            --exclude='/README.md' --exclude='/pubspec.yaml' \
            /tmp/tunnel_temp/ ./
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p android/app/src/main/jniLibs/$arch
            cp "$SOURCE_DIR/output/$arch/libcloudflared.so" android/app/src/main/jniLibs/$arch/
          done
          echo "✅ Project scaffolding ready"

      - name: Create MainActivity with MethodChannel
        run: |
          mkdir -p android/app/src/main/kotlin/com/TGNF/tunnel_controller
          cat > android/app/src/main/kotlin/com/TGNF/tunnel_controller/MainActivity.kt << 'EOF'
          package com.TGNF.tunnel_controller

          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.TGNF.tunnel_controller/native"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getNativeLibraryDir") {
                          result.success(applicationInfo.nativeLibraryDir)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF
          echo "✅ MainActivity.kt created"

      - name: Upgrade Kotlin version
        run: |
          if grep -q 'ext.kotlin_version' android/build.gradle; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle
          else
            sed -i '1i ext.kotlin_version = "1.9.22"' android/build.gradle
          fi
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(org\.jetbrains\.kotlin\.android" version )"[0-9.]+"/\1"1.9.22"/' android/settings.gradle
          fi
          echo "✅ Kotlin version set to 1.9.22"

      - name: Configure Android build
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          cat > android/app/build.gradle << EOF
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace "com.TGNF.tunnel_controller"
              compileSdkVersion 34
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.TGNF.tunnel_controller"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode ${VERSION_CODE}
                  versionName "${VERSION_NAME}"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties.keyAlias
                      keyPassword keystoreProperties.keyPassword
                      storeFile keystoreProperties.storeFile ? file(keystoreProperties.storeFile) : null
                      storePassword keystoreProperties.storePassword
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {}
          EOF

          sed -i "s/^version: .*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml

      - name: Update Android Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:label="Tunnel Controller"
                  android:name="android.app.Application"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <service
                      android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"
                      android:stopWithTask="false" />

              </application>
          </manifest>
          EOF
          echo "✅ AndroidManifest.xml updated"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: |
          if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
            flutter test
          else
            echo "⚠️ No tests found, skipping"
          fi

      - name: Build APK (full architecture)
        run: flutter build apk --release

      - name: Verify APK signature and checksum
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "🔑 APK signature:"
          keytool -printcert -jarfile "$APK" | grep "SHA-256" || echo "⚠️ APK built successfully"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256sum"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-controller-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256sum
          retention-days: 90

      - name: Mark release eligibility
        id: check
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version changes
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml versioncode.txt
          git commit -m "Bump version to $(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r') [skip ci]" || echo "No changes to commit"
          git push

  # ================= RELEASE JOB =================
  release:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ⬇️ BƯỚC QUAN TRỌNG: checkout để có .git
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: tunnel-controller-apk
          path: dist

      - name: List artifacts
        run: ls -lh dist

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}       # ⬅️ dự phòng nếu checkout lỗi
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          CF_REF: ${{ needs.build.outputs.cloudflared_ref }}
        run: |
          TAG="v${VERSION_NAME}+${VERSION_CODE}"
          echo "🏷️ Creating release $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Release $TAG đã tồn tại, xóa để tạo lại..."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          cat > RELEASE_NOTES.md <<EOF
          **Automated release** từ commit \`${GITHUB_SHA::7}\`

          - 📦 Version: \`${VERSION_NAME}+${VERSION_CODE}\`
          - 🚀 cloudflared: \`${CF_REF}\`
          - 🏗️ Kiến trúc: arm64-v8a, armeabi-v7a, x86_64, x86
          - 🔐 Ký bằng release keystore

          ### Files
          - \`app-release.apk\` — APK full kiến trúc
          - \`app-release.apk.sha256sum\` — checksum
          EOF

          gh release create "$TAG" \
            --title "Tunnel Controller ${VERSION_NAME}+${VERSION_CODE}" \
            --notes-file RELEASE_NOTES.md \
            dist/*.apk dist/*.sha256sum

          echo "✅ Đã publish release $TAG"

      - name: Summary
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          echo "### ✅ Đã release v${VERSION_NAME}+${VERSION_CODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 [Xem release](https://github.com/${{ github.repository }}/releases/tag/v${VERSION_NAME}+${VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"
