name: tunnel_controller
description: Cloudflare Tunnel Controller
publish_to: 'none'
version: 1.0.0+3
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  permission_handler: ^11.0.0
  device_info_ce: ^1.0.0
  package_info_plus: ^8.0.0

  # Foreground service & WakeLock
  flutter_foreground_task: ^5.0.0
  wakelock_plus: ^1.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0

  # Secure storage (encrypted token)
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "Tunnel.png"
  adaptive_icon_background: "#030817"
  adaptive_icon_foreground: "Tunnel.png"
